kind = "mobile"
previewPath = "/"
title = "Rakshak - Women's Safety App"
version = "1.0.0"
id = "artifacts/rakshak"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 21989

[services.development]
run = "pnpm --filter @workspace/rakshak run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rakshak", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/rakshak", "run", "serve" ]

[services.env]
PORT = "21989"
BASE_PATH = "/"
